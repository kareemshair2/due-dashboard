name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate placeholder config
        run: npm run config:ci
        env:
          DUE_SPREADSHEET_ID: ${{ vars.DUE_SPREADSHEET_ID || 'placeholder' }}
          DUE_PROVIDER: gviz

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test
